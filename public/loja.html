<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cogumelo Store - Loja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-store">

    <header class="topo-loja">

        <div class="logo-loja">
             <span>Cogumelo Store</span>
        </div>

        <div class="pesquisa">

            <span class="lupa">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
        
            <input
                type="text"
                placeholder="Pesquisar jogos..."
            >
        
            <button class="btn-pesquisar">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            
            <button class="icone" id="btnSair" title="Sair">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>

        <div class="menu-direita">

            <button class="icone" title="Carrinho">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="contador">0</span>
            </button>
        
            <button class="icone" title="Favoritos">
                <i class="fa-solid fa-heart"></i>
            </button>
        
            <button class="icone" title="Perfil">
                <i class="fa-solid fa-user"></i>
            </button>
        
        </div>

    </header>

    <main class="conteudo">

        <h1>Destaques</h1>

        <section class="catalogo">

            <div class="card-game">
                <img src="majoras%20mask.png" alt="jogo majoras mask">
                <h3>Zelda Majora's Mask</h3>
                <p>R$ 249,99</p>
                <button>Comprar</button>
            </div>

            <div class="card-game">
                <img src="star%20fox.png" alt="jogo star fox">
                <h3>Star Fox 64</h3>
                <p>R$ 220,00</p>
                <button>Comprar</button>
            </div>

            <div class="card-game">
                <img src="jogo1.jpg" alt="jogo mario 64">
                <h3>Super Mario 64</h3>
                <p>R$ 99,99</p>
                <button>Comprar</button>
            </div>

            <div class="card-game">
                <img src="pokemon.jpg" alt="jogo pokemon">
                <h3>Pokémon FireRed</h3>
                <p>R$ 59,99</p>
                <button>Comprar</button>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
